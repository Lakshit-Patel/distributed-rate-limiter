services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  api-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rate-limiter-api-1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INSTANCE_ID=api-instance-1
      - RATE_LIMIT_FAIL_POLICY=fail_open
      - TRUSTED_PROXIES=127.0.0.1,::1,nginx
    depends_on:
      redis:
        condition: service_healthy

  api-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rate-limiter-api-2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INSTANCE_ID=api-instance-2
      - RATE_LIMIT_FAIL_POLICY=fail_open
      - TRUSTED_PROXIES=127.0.0.1,::1,nginx
    depends_on:
      redis:
        condition: service_healthy

  api-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rate-limiter-api-3
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INSTANCE_ID=api-instance-3
      - RATE_LIMIT_FAIL_POLICY=fail_open
      - TRUSTED_PROXIES=127.0.0.1,::1,nginx
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: rate-limiter-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
